# Legacy F5 iSeries Configuration Sample (bigip.conf)
# Hostname: iseries-prod-01.legacy.corp
# TMOS Version: 13.1.3

sys chassis {
    description "F5 iSeries i5800 Appliance"
}

net vlan /Common/vlan_external {
    interfaces {
        1.1 {
            tag-mode none
        }
    }
    tag 100
}

net vlan /Common/vlan_internal {
    interfaces {
        1.2 {
            tag-mode none
        }
    }
    tag 200
}

net self /Common/self_external {
    address 10.1.100.10/24
    allow-service none
    vlan /Common/vlan_external
}

net self /Common/self_internal {
    address 10.1.200.10/24
    allow-service none
    vlan /Common/vlan_internal
}

ltm node /Common/web_node_01 {
    address 192.168.10.11
}

ltm node /Common/web_node_02 {
    address 192.168.10.12
}

ltm node /Common/api_node_01 {
    address 192.168.20.11
}

ltm node /Common/api_node_02 {
    address 192.168.20.12
}

ltm monitor http /Common/mon_legacy_http {
    adaptive disabled
    defaults-from /Common/http
    destination *:*
    interval 5
    recv "200 OK"
    send "GET /\r\n"
    time-until-up 0
    timeout 16
}

ltm monitor http /Common/mon_app_health {
    adaptive disabled
    defaults-from /Common/http
    destination *:*
    interval 5
    recv "status: ok"
    send "GET /health HTTP/1.0\r\n\r\n"
    time-until-up 0
    timeout 16
}

ltm pool /Common/pool_web_frontend {
    load-balancing-mode round-robin
    members {
        /Common/web_node_01:8080 {
            address 192.168.10.11
            session user-enabled
            state user-up
        }
        /Common/web_node_02:8080 {
            address 192.168.10.12
            session user-enabled
            state user-up
        }
    }
    monitor /Common/mon_legacy_http
}

ltm pool /Common/pool_api_backend {
    load-balancing-mode least-connections-member
    members {
        /Common/api_node_01:8443 {
            address 192.168.20.11
            session user-enabled
        }
        /Common/api_node_02:8443 {
            address 192.168.20.12
            session user-enabled
        }
    }
    monitor /Common/mon_app_health
}

ltm profile client-ssl /Common/clientssl_legacy_insecure {
    app-service none
    cert /Common/legacy_cert.crt
    chain /Common/legacy_chain.crt
    ciphers "COMPAT:RC4-SHA:DES-CBC3-SHA:DEFAULT"
    defaults-from /Common/clientssl
    key /Common/legacy_cert.key
    options { dont-insert-empty-fragments no-sslv2 no-sslv3 }
}

ltm profile client-ssl /Common/clientssl_modern {
    app-service none
    cert /Common/modern_wildcard.crt
    chain /Common/modern_chain.crt
    ciphers "ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384"
    defaults-from /Common/clientssl
    key /Common/modern_wildcard.key
    options { dont-insert-empty-fragments no-sslv2 no-sslv3 no-tlsv1 no-tlsv1.1 }
}

ltm rule /Common/rule_legacy_routing {
    when HTTP_REQUEST {
        if { [matchclass [HTTP::uri] starts_with /api] } {
            pool /Common/pool_api_backend
        } else {
            pool /Common/pool_web_frontend
        }
    }
}

ltm virtual /Common/vs_ecommerce_https {
    destination /Common/10.1.100.50:443
    ip-protocol tcp
    mask 255.255.255.255
    pool /Common/pool_web_frontend
    profiles {
        /Common/clientssl_legacy_insecure {
            context clientside
        }
        /Common/http { }
        /Common/tcp { }
    }
    rules {
        /Common/rule_legacy_routing
    }
    source 0.0.0.0/0
    translate-address enabled
    translate-port enabled
}

ltm virtual /Common/vs_api_gateway_https {
    destination /Common/10.1.100.60:443
    ip-protocol tcp
    mask 255.255.255.255
    pool /Common/pool_api_backend
    profiles {
        /Common/clientssl_modern {
            context clientside
        }
        /Common/http { }
        /Common/tcp { }
    }
    source 0.0.0.0/0
    translate-address enabled
    translate-port enabled
}

# GTM / BIG-IP DNS Section
gtm datacenter /Common/DC_Primary {
    location "Legacy On-Prem Data Center 1"
}

gtm server /Common/server_iseries_primary {
    datacenter /Common/DC_Primary
    devices {
        iseries_01 {
            addresses {
                10.1.100.10 { }
            }
        }
    }
    product bigip
}

gtm pool a /Common/pool_gtm_portal {
    members {
        /Common/server_iseries_primary:/Common/vs_ecommerce_https {
            member-order 0
        }
    }
}

gtm wideip a /Common/portal.enterprise.com {
    pools {
        /Common/pool_gtm_portal {
            order 0
        }
    }
}
